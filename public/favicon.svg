<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4ff1a"/>
      <stop offset="100%" stop-color="#a8db00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#c8ff00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#2a2a32" stroke-width="1.5" fill="none"/>

  <!-- Glowing outer audio waves -->
  <path d="M7 27 C5 30 5 34 7 37" stroke="#c8ff00" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M57 27 C59 30 59 34 57 37" stroke="#c8ff00" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Headphone Arc -->
  <path d="M17 31 C17 19 47 19 47 31" fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Headphone Ear Pads -->
  <rect x="13" y="27" width="6" height="13" rx="3" fill="#c8ff00" filter="url(#glow)"/>
  <rect x="45" y="27" width="6" height="13" rx="3" fill="#c8ff00" filter="url(#glow)"/>

  <!-- Face Screen / Capsule -->
  <rect x="21" y="23" width="22" height="23" rx="9" fill="#141418" stroke="#2a2a34" stroke-width="1.5"/>

  <!-- Soundwave forehead indicator -->
  <line x1="28" y1="27" x2="28" y2="29" stroke="#c8ff00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="26" x2="32" y2="30" stroke="#c8ff00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="27" x2="36" y2="29" stroke="#c8ff00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Cute Happy Eyes (^  ^) -->
  <path d="M26 34 Q28 31 30 34" fill="none" stroke="#c8ff00" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 34 Q36 31 38 34" fill="none" stroke="#c8ff00" stroke-width="2" stroke-linecap="round"/>

  <!-- Cute Smile (‿) -->
  <path d="M30 39 Q32 41.5 34 39" fill="none" stroke="#c8ff00" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cute Blush Cheeks -->
  <circle cx="25" cy="37.5" r="1.6" fill="#a78bfa" opacity="0.85"/>
  <circle cx="39" cy="37.5" r="1.6" fill="#a78bfa" opacity="0.85"/>
</svg>